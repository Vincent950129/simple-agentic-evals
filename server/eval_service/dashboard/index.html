<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Eval Service · User Analytics</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">E</span>
        <div><strong>Eval Service</strong><small>live user analytics</small></div>
      </div>
      <div class="top-actions">
        <span id="liveStatus" class="status muted"><i></i> disconnected</span>
        <button id="refreshButton" class="icon-button" type="button" title="Refresh now" disabled>↻</button>
      </div>
    </header>

    <main>
      <div id="dashboard" class="dashboard">
        <section class="page-head">
          <div>
            <p class="eyebrow">USAGE OVERVIEW</p>
            <h1>Evaluation traffic</h1>
            <p id="freshness" class="subtle">Waiting for data…</p>
          </div>
          <label class="search"><span>⌕</span><input id="userSearch" type="search" placeholder="Find a user"></label>
        </section>

        <aside id="coverageNotice" class="notice hidden"></aside>

        <section id="kpis" class="kpi-grid"></section>

        <section class="panel users-panel">
          <div class="panel-head">
            <div><p class="eyebrow">PEOPLE</p><h2>Usage by user</h2></div>
            <span id="userCount" class="pill"></span>
          </div>
          <div class="user-layout">
            <div class="table-wrap user-table-wrap">
              <table>
                <thead><tr><th>User</th><th>Calls</th><th>Success</th><th>Sessions</th><th>Grades</th><th>Last seen</th></tr></thead>
                <tbody id="usersBody"></tbody>
              </table>
              <p id="emptyUsers" class="empty hidden">No matching users.</p>
            </div>
            <aside id="userDetail" class="user-detail"></aside>
          </div>
        </section>

        <section class="two-column">
          <article class="panel trend-panel">
            <div class="panel-head">
              <div><p class="eyebrow">LAST 60 DAYS</p><h2>Request volume</h2></div>
              <span class="legend"><i></i> calls / day</span>
            </div>
            <div id="trendChart" class="trend-chart"></div>
          </article>
          <article class="panel activity-panel">
            <div class="panel-head">
              <div><p class="eyebrow">LIVE FEED</p><h2>Recent traffic</h2></div>
              <span class="pulse-dot"></span>
            </div>
            <div id="recentList" class="activity-list"></div>
          </article>
        </section>
      </div>
    </main>
  </div>
  <script src="/app.js" defer></script>
</body>
</html>
