[project]
name = "simple-agentic-evals"
version = "0.19.1"
description = "Hosted/local client, isolated command adapter, and general evolving-benchmark evaluator."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27"]

# The provided harnesses (react_agent / acp_codex_agent) run on the service, so
# the base install is just ``httpx``. The ``openai`` extra is only for the
# bring-your-own-agent examples that call OpenAI directly (the SDK itself never
# imports it).
[project.optional-dependencies]
openai = ["openai>=1.0"]

# stdio<->HTTP MCP bridge (used by the service/harness). Also runnable as
# `python -m simple_agentic_evals.mcp_bridge`.
[project.scripts]
simple-agentic-evals-mcp-bridge = "simple_agentic_evals.mcp_bridge:main"
evolve-eval = "simple_agentic_evals.skill_cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["simple_agentic_evals", "simple_agentic_evals.acp"]
